name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check backend tests

      - name: Black (format check)
        run: black --check backend tests

      - name: Mypy (type check)
        run: mypy

      - name: Pytest (fast suite + coverage)
        run: pytest -m "not ai_eval and not slow" --cov=backend/app --cov-report=term-missing
